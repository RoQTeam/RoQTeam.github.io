<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
	<!-- Quantum Foundations: a first circuit (H, then two CNOTs, then measurement), drawn like the other challenge images -->
	<rect width="800" height="800" fill="#000" />
	<g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
		<!-- three qubits -->
		<path d="M 112 250 H 580 M 112 400 H 580 M 112 550 H 580" />
		<!-- Hadamard on the first -->
		<rect x="185" y="205" width="90" height="90" rx="10" fill="#000" />
		<path d="M 210 225 V 275 M 250 225 V 275 M 210 250 H 250" />
		<!-- CNOT 1 → 2 -->
		<path d="M 360 250 V 438" />
		<circle cx="360" cy="400" r="38" fill="#000" />
		<path d="M 322 400 H 398 M 360 362 V 438" />
		<!-- CNOT 2 → 3 -->
		<path d="M 480 400 V 588" />
		<circle cx="480" cy="550" r="38" fill="#000" />
		<path d="M 442 550 H 518 M 480 512 V 588" />
		<!-- measurements -->
		<rect x="580" y="210" width="100" height="80" rx="10" fill="#000" />
		<path d="M 600 268 A 30 30 0 0 1 660 268 M 630 268 L 652 232" />
		<rect x="580" y="360" width="100" height="80" rx="10" fill="#000" />
		<path d="M 600 418 A 30 30 0 0 1 660 418 M 630 418 L 652 382" />
		<rect x="580" y="510" width="100" height="80" rx="10" fill="#000" />
		<path d="M 600 568 A 30 30 0 0 1 660 568 M 630 568 L 652 532" />
	</g>
	<g fill="#fff">
		<!-- the qubits' starting points and the CNOT controls -->
		<circle cx="112" cy="250" r="13" />
		<circle cx="112" cy="400" r="13" />
		<circle cx="112" cy="550" r="13" />
		<circle cx="360" cy="250" r="18" />
		<circle cx="480" cy="400" r="18" />
	</g>
</svg>
