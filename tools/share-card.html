<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>BreaQ 2026 share card (render source)</title>
	<!--
		Source for images/share/breaq-2026.jpg (1200x630, Open Graph) and images/favicon-2026.png.
		Open this page in a browser at 100% zoom and capture the two boxes; or ask Claude Code to
		regenerate them. Edit the dates and venues here when they change.
	-->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:200,700|Source+Sans+Pro:300,600" />
	<style>
		body { margin: 0; background: #111; font-family: "Source Sans Pro", Helvetica, sans-serif; }
		.card {
			position: relative; width: 1200px; height: 630px; overflow: hidden; color: #fff;
			background:
				radial-gradient(ellipse 60% 80% at 82% 45%, rgba(76, 92, 150, 0.55), transparent 70%),
				linear-gradient(120deg, #262838 0%, #2e3141 55%, #1f2130 100%);
		}
		.card svg.orbits { position: absolute; right: -40px; top: -20px; width: 700px; height: 700px; opacity: 0.9; }
		.card .orbit { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1.5; }
		.card .dot { fill: #ff8c00; }
		.card .logo { position: absolute; right: 90px; top: 115px; width: 400px; height: 400px; }
		.card .text { position: absolute; left: 84px; top: 88px; width: 640px; }
		.card .kicker { font-family: Raleway, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 8px; text-transform: uppercase; color: #ff8c00; margin: 0 0 16px; }
		.card h1 { font-family: Raleway, sans-serif; font-weight: 700; font-size: 84px; letter-spacing: 6px; text-transform: uppercase; line-height: 1; margin: 0 0 20px; }
		.card .tag { font-family: Raleway, sans-serif; font-weight: 200; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; line-height: 1.3; margin: 0 0 26px; color: rgba(255, 255, 255, 0.9); }
		.card .rule { width: 90px; height: 3px; background: #ff8c00; margin: 0 0 26px; }
		.card .facts { display: flex; gap: 52px; }
		.card .fact b { display: block; font-family: Raleway, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px; white-space: nowrap; }
		.card .fact span { font-size: 20px; font-weight: 300; color: rgba(255, 255, 255, 0.75); white-space: nowrap; }
		.card .foot { position: absolute; left: 84px; bottom: 44px; display: flex; gap: 36px; align-items: center; font-family: Raleway, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); }
		.card .foot i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff8c00; margin-right: 12px; vertical-align: middle; }
		.icon { position: relative; width: 256px; height: 256px; border-radius: 56px; background: linear-gradient(135deg, #34385a 0%, #262838 100%); overflow: hidden; }
		.icon img { position: absolute; left: 18px; top: 10px; width: 220px; height: 220px; }
		/* laid out for capture: scaled so a 1200x630 capture of the browser frame is 1:1 */
		.stage { position: absolute; left: 0; top: 0; transform: scale(1.2245); transform-origin: 0 0; }
		.stage .icon { position: absolute; left: 1240px; top: 0; }
	</style>
</head>
<body>
	<div class="stage">
		<div class="card">
			<svg class="orbits" viewBox="0 0 400 400" aria-hidden="true">
				<path class="orbit" d="M 348.3 145.8 A 160 62 -20 1 1 51.7 254.2 A 160 62 -20 1 1 348.3 145.8" />
				<path class="orbit" d="M 326.1 302.8 A 160 62 40 1 1 73.9 97.2 A 160 62 40 1 1 326.1 302.8" />
				<path class="orbit" d="M 177.7 358.4 A 160 62 98 1 1 222.3 41.6 A 160 62 98 1 1 177.7 358.4" />
				<circle class="dot" cx="51.7" cy="254.2" r="5" />
				<circle class="dot" cx="326.1" cy="302.8" r="5" />
				<circle class="dot" cx="222.3" cy="41.6" r="5" />
			</svg>
			<img class="logo" src="../images/BreaQ_logo_2026-light.svg" alt="" />
			<div class="text">
				<p class="kicker">RoQTeam presents</p>
				<h1>BreaQ<br />2026</h1>
				<p class="tag">Breaking the Boundaries<br />of Quantum Uncertainty</p>
				<div class="rule"></div>
				<div class="facts">
					<div class="fact"><b>24–25 October</b><span>Hackathon · CAMPUS Research Institute</span></div>
					<div class="fact"><b>14 November</b><span>Talks · Military Technical Academy</span></div>
				</div>
			</div>
			<div class="foot"><span><i></i>Bucharest</span><span><i></i>Free to attend</span><span><i></i>roqteam.github.io</span></div>
		</div>
		<div class="icon"><img src="../images/BreaQ_logo_2026-light.svg" alt="" /></div>
	</div>
</body>
</html>
